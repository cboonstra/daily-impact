spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/daily-impact}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days

logging:
  level:
    com.dailyimpact: DEBUG
